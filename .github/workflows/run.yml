name: Build Plugin Index

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * *'   
  repository_dispatch:
    types: [repo-added]

env:
  ORG: Dioxamine-plugins-repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout registry repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ORG_ADMIN_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build index
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: python3 build_index.py

      - name: Commit and push index.json
        run: |
          git config user.name "index-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.json
          git diff --cached --quiet || git commit -m "Update plugin index"
          git push
